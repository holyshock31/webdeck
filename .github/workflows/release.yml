name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 三平台各自原生构建（禁止交叉编译：mac runner 不产 Windows 包）。
      # macOS：secrets 齐备时自动签名 + 公证（notarize 经 --config 注入）；
      #       secrets 缺失时构建未签名产物，artifactName 注入 -unsigned 后缀——
      #       后缀在构建时生效，latest-mac.yml 元数据与资产名同时生成、天然一致
      #       （禁止构建后 mv 重命名：会导致元数据 url 与资产名不一致，更新 404）。
      # Windows：当前决策「先不签」（SmartScreen 提示，README 有绕过指引）。
      - name: Build macOS (signed + notarized)
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: npx electron-builder --mac --publish never \
          --config.mac.notarize=true \
          --config.mac.notarize.teamId=${{ secrets.APPLE_TEAM_ID }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS (unsigned, no notarization)
        if: runner.os == 'macOS' && env.CSC_LINK == ''
        # 注意：必须用 block scalar（|）保留真实换行——普通标量会把行尾 `\` 折叠成
        # `\ `（反斜杠+空格），bash 视其为转义空格，导致参数带前导空格被 yargs 拒绝
        # （Unknown argument，v0.1.11 首次 CI 事故）。
        # 无证书分支产出可被 Squirrel.Mac 接受的更新包（fix-mac-unsigned-update）：
        #   1) --mac dir 只构建 .app（不直接出 zip）；
        #   2) 对 .app 做完整 ad-hoc 签名（密封资源）——否则 codesign --verify 报
        #      "code has no resources but signature indicates they must be present"，
        #      Squirrel.Mac 安装前签名校验失败、自动更新静默中止（v0.1.14 事故）；
        #   3) 注入 app-update.yml（更新配置）：--mac dir 阶段不生成该文件（targets 不含
        #      dmg/zip），缺失则打包态客户端更新检查 ENOENT（v0.1.15 事故）；注入必须在
        #      codesign 之前——新文件进入密封资源，签名校验（含 Squirrel.Mac）完整认可；
        #   4) --prepackaged 从已签名 .app 出 dmg/zip/latest-mac.yml（元数据与实际
        #      资产天然一致，artifactName 保持 -unsigned 后缀约定不变）；
        #   5) 出包前 codesign 断言 + 出包后 zip 内容断言：任一步失败即 job 失败，
        #      坏包/缺更新配置的包进不了 release。
        run: |
          npx electron-builder --mac dir --publish never
          APP_PATH="$(find dist -maxdepth 2 -name '*.app' -type d | head -1)"
          printf 'owner: holyshock31\nrepo: webdeck\nprovider: github\nupdaterCacheDirName: webdeck-updater\n' \
            > "$APP_PATH/Contents/Resources/app-update.yml"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          npx electron-builder --mac --prepackaged "$APP_PATH" --publish never \
            --config.mac.artifactName=WebDeck-\${version}-\${arch}-mac\${env.UNSIGNED_SUFFIX}.\${ext}
          # 出包断言：产物 zip 必须携带 app-update.yml（缺失即 job 失败，release 保持 draft）
          unzip -l dist/WebDeck-*-mac-*.zip | grep -q 'Contents/Resources/app-update.yml' \
            || { echo "FAIL: 产物 zip 缺少 Contents/Resources/app-update.yml"; exit 1; }
        env:
          UNSIGNED_SUFFIX: '-unsigned'

      - name: Build Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      # 发布门禁：三平台资产全部上传进 draft（草稿）release，不自动发布、不自动标记
      # Latest——维护者在 GitHub Releases 页面确认资产齐全后手动 "Publish release"
      # 才对外可见（electron-updater 不读取 draft release 元数据，半成品永远不会被
      # 客户端自动发现；任一平台构建失败时 release 保持草稿、客户端不受影响）。
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          fail_on_unmatched_files: false
          draft: true
          make_latest: false
