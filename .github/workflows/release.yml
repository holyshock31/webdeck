name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 三平台各自原生构建（禁止交叉编译：mac runner 不产 Windows 包）。
      # macOS：secrets 齐备时自动签名 + 公证（notarize 经 --config 注入）；
      #       secrets 缺失时构建未签名产物，artifactName 注入 -unsigned 后缀——
      #       后缀在构建时生效，latest-mac.yml 元数据与资产名同时生成、天然一致
      #       （禁止构建后 mv 重命名：会导致元数据 url 与资产名不一致，更新 404）。
      # Windows：当前决策「先不签」（SmartScreen 提示，README 有绕过指引）。
      - name: Build macOS (signed + notarized)
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: npx electron-builder --mac --publish never \
          --config.mac.notarize=true \
          --config.mac.notarize.teamId=${{ secrets.APPLE_TEAM_ID }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS (unsigned, no notarization)
        if: runner.os == 'macOS' && env.CSC_LINK == ''
        run: npx electron-builder --mac --publish never \
          --config.mac.artifactName=WebDeck-\${version}-\${arch}-mac\${env.UNSIGNED_SUFFIX}.\${ext}
        env:
          UNSIGNED_SUFFIX: '-unsigned'

      - name: Build Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      # 发布门禁：三平台资产全部上传进 draft（草稿）release，不自动发布、不自动标记
      # Latest——维护者在 GitHub Releases 页面确认资产齐全后手动 "Publish release"
      # 才对外可见（electron-updater 不读取 draft release 元数据，半成品永远不会被
      # 客户端自动发现；任一平台构建失败时 release 保持草稿、客户端不受影响）。
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          fail_on_unmatched_files: false
          draft: true
          make_latest: false
