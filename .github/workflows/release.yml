name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    # 触发标志必须放 job 级 env：GitHub Actions 的 step `if` 看不到 step 级 env、
    # 也看不到 secrets context（官方上下文可用性表 + runner 源码 StepsRunner.cs），
    # 只能在 job/workflow 级 env 里先把 secrets 转成布尔标志。
    env:
      HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
      HAS_APPLE_CREDS: ${{ secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 三平台各自原生构建（禁止交叉编译：mac runner 不产 Windows 包）。
      # macOS 三个互斥分支（凭据齐全度决定，条件互斥只命中其一）：
      #   1) Developer ID 签名 + 公证：CSC_LINK + Apple 公证凭据齐全；
      #   2) 证书签名、不公证：只有 CSC_LINK（自签名/任意 p12 证书皆可，Squirrel.Mac
      #      跨版本校验通过、自动更新可用）；证书须先加入本机信任（electron-builder
      #      身份发现只认 find-identity -v 有效身份），步骤内完成；
      #   3) ad-hoc 签名兜底：无 CSC_LINK（产物可用、自动更新不可用，需手动安装）。
      # 产物命名：分支 1 无后缀；分支 2/3 带 -unsigned 后缀（语义="未用 Developer ID
      # 签名"），后缀在构建时生效，latest-mac.yml 元数据与资产名同时生成、天然一致
      # （禁止构建后 mv 重命名：会导致元数据 url 与资产名不一致，更新 404）。
      - name: Build macOS (signed + notarized)
        if: runner.os == 'macOS' && env.HAS_CSC_LINK == 'true' && env.HAS_APPLE_CREDS == 'true'
        run: |
          npx electron-builder --mac --publish never \
            --config.mac.notarize=true \
            --config.mac.notarize.teamId=${{ secrets.APPLE_TEAM_ID }}
          # 出包断言：签名产物必须通过严格校验（防止无签名出包进入 release）
          APP_PATH="$(find dist -maxdepth 2 -name '*.app' -type d | head -1)"
          codesign --verify --deep --strict "$APP_PATH" \
            || { echo "FAIL: 签名产物校验未通过"; exit 1; }
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS (cert-signed, no notarization)
        if: runner.os == 'macOS' && env.HAS_CSC_LINK == 'true' && env.HAS_APPLE_CREDS == 'false'
        # 证书签名（自签名/任意 p12），不公证。全链路本机实测验证过，要点：
        #   1) --mac dir 构建未签名 .app（--config.mac.identity=null 显式禁掉
        #      electron-builder 自动签名——其身份发现只认受信任身份，自签名证书
        #      会跳过签名）；
        #   2) 注入 app-update.yml（必须在签名前——进入密封资源）；
        #   3) 临时钥匙串导入 CSC_LINK 证书（无 UI 命令，electron-builder 同款流程；
        #      不用 security add-trusted-cert——无 GUI runner 上会挂起等 UI）；
        #   4) 自底向上逐组件签名（禁用 --deep：Electron 37 发行版含 linker-signed
        #      组件，--deep 证书签名替换报 errSecInternalComponent；--timestamp=none
        #      不依赖外部 timestamp 服务器）；
        #   5) 断言：严格校验 + 指定需求为证书锚定（certificate root = H"..."，非
        #      cdhash）——防回归 ad-hoc 形态；
        #   6) --prepackaged 出 dmg/zip/latest-mac.yml（元数据与实际资产天然一致，
        #      artifactName 保持 -unsigned 后缀约定）；
        #   7) 出包断言：zip 内 app 严格校验 + 含 app-update.yml（缺失即 job 失败）。
        run: |
          npx electron-builder --mac dir --publish never --config.mac.identity=null
          APP_PATH="$(find dist -maxdepth 2 -name '*.app' -type d | head -1)"
          printf 'owner: holyshock31\nrepo: webdeck\nprovider: github\nupdaterCacheDirName: webdeck-updater\n' \
            > "$APP_PATH/Contents/Resources/app-update.yml"
          echo "$CSC_LINK" | base64 -d > /tmp/csc.p12
          KEYCHAIN="/tmp/webdeck-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          rm -f "$KEYCHAIN"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import /tmp/csc.p12 -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          IDENT="$(security find-identity -p codesigning "$KEYCHAIN" | grep -oE '[0-9A-F]{40}' | head -1)"
          [ -n "$IDENT" ] || { echo "FAIL: 未找到签名身份"; exit 1; }
          find "$APP_PATH/Contents" -type f \( -name '*.dylib' -o -path '*/Helpers/*' \) -print0 \
            | while IFS= read -r -d '' f; do
                file "$f" | grep -q 'Mach-O' && codesign --force --sign "$IDENT" --timestamp=none "$f"
              done
          for fw in "$APP_PATH/Contents/Frameworks"/*.framework; do
            codesign --force --sign "$IDENT" --timestamp=none "$fw"
          done
          for h in "$APP_PATH/Contents/Frameworks"/*.app; do
            codesign --force --sign "$IDENT" --timestamp=none "$h"
          done
          codesign --force --sign "$IDENT" --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH" \
            || { echo "FAIL: 产物签名校验未通过"; exit 1; }
          codesign -d --requirements - "$APP_PATH" | grep -q 'certificate root = H"' \
            || { echo "FAIL: 产物指定需求非证书锚定（可能退回 ad-hoc）"; exit 1; }
          codesign -d --requirements - "$APP_PATH" | grep -q 'cdhash H"' \
            && { echo "FAIL: 产物指定需求为 cdhash（ad-hoc 形态）"; exit 1; }
          npx electron-builder --mac --prepackaged "$APP_PATH" --publish never \
            --config.mac.artifactName=WebDeck-\${version}-\${arch}-mac\${env.UNSIGNED_SUFFIX}.\${ext}
          ZIP="$(ls dist/WebDeck-*-mac-*.zip | head -1)"
          rm -rf /tmp/verify-app && mkdir -p /tmp/verify-app
          unzip -q "$ZIP" -d /tmp/verify-app
          VERIFY_APP="$(find /tmp/verify-app -maxdepth 2 -name '*.app' -type d | head -1)"
          codesign --verify --deep --strict "$VERIFY_APP" \
            || { echo "FAIL: 产物 zip 内签名校验未通过"; exit 1; }
          test -f "$VERIFY_APP/Contents/Resources/app-update.yml" \
            || { echo "FAIL: 产物 zip 缺少 Contents/Resources/app-update.yml"; exit 1; }
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          UNSIGNED_SUFFIX: '-unsigned'

      - name: Build macOS (unsigned ad-hoc fallback)
        if: runner.os == 'macOS' && env.HAS_CSC_LINK == 'false'
        # 无证书兜底：ad-hoc 签名产物可用（首次安装需右键打开），但指定需求为
        # cdhash（绑定单构建二进制），跨版本自动更新不可用——需手动安装新版本。
        # 注意：必须用 block scalar（|）保留真实换行——普通标量会把行尾 `\` 折叠成
        # `\ `（反斜杠+空格），bash 视其为转义空格，导致参数带前导空格被 yargs 拒绝
        # （Unknown argument，v0.1.11 首次 CI 事故）。
        # 流程：
        #   1) --mac dir 只构建 .app（不直接出 zip）；
        #   2) 注入 app-update.yml（更新配置）：--mac dir 阶段不生成该文件（targets 不含
        #      dmg/zip），缺失则打包态客户端更新检查 ENOENT（v0.1.15 事故）；注入必须在
        #      codesign 之前——新文件进入密封资源，签名校验完整认可；
        #   3) 对 .app 做完整 ad-hoc 签名（密封资源）——否则 codesign --verify 报
        #      "code has no resources but signature indicates they must be present"，
        #      Squirrel.Mac 安装前签名校验失败（v0.1.14 事故）；
        #   4) --prepackaged 从已签名 .app 出 dmg/zip/latest-mac.yml（元数据与实际
        #      资产天然一致，artifactName 保持 -unsigned 后缀约定不变）；
        #   5) 出包前 codesign 断言 + 出包后 zip 内容断言：任一步失败即 job 失败，
        #      坏包/缺更新配置的包进不了 release。
        run: |
          npx electron-builder --mac dir --publish never
          APP_PATH="$(find dist -maxdepth 2 -name '*.app' -type d | head -1)"
          printf 'owner: holyshock31\nrepo: webdeck\nprovider: github\nupdaterCacheDirName: webdeck-updater\n' \
            > "$APP_PATH/Contents/Resources/app-update.yml"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          npx electron-builder --mac --prepackaged "$APP_PATH" --publish never \
            --config.mac.artifactName=WebDeck-\${version}-\${arch}-mac\${env.UNSIGNED_SUFFIX}.\${ext}
          # 出包断言：产物 zip 必须携带 app-update.yml（缺失即 job 失败，release 保持 draft）
          unzip -l dist/WebDeck-*-mac-*.zip | grep -q 'Contents/Resources/app-update.yml' \
            || { echo "FAIL: 产物 zip 缺少 Contents/Resources/app-update.yml"; exit 1; }
        env:
          UNSIGNED_SUFFIX: '-unsigned'

      - name: Build Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      # 发布门禁：三平台资产全部上传进 draft（草稿）release，不自动发布、不自动标记
      # Latest——维护者在 GitHub Releases 页面确认资产齐全后手动 "Publish release"
      # 才对外可见（electron-updater 不读取 draft release 元数据，半成品永远不会被
      # 客户端自动发现；任一平台构建失败时 release 保持草稿、客户端不受影响）。
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          fail_on_unmatched_files: false
          draft: true
          make_latest: false
