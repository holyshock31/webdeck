<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>展开侧边栏</title>
  <style>
    /* 浮动展开按钮：覆盖视图随壳主题切换（theme 查询参数由主进程注入） */
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    body { width: 100%; height: 100%; display: flex; }
    button {
      flex: 1;
      border: 0;
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      color: #d8dce4;
      background: rgba(27, 30, 38, 0.92);
      border: 1px solid rgba(44, 49, 61, 0.9);
      border-left: none;
      border-radius: 0 8px 8px 0;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.35);
    }
    button:hover { background: #2d3342; }
    body.light button {
      color: #1c2128;
      background: rgba(255, 255, 255, 0.95);
      border-color: #d5d9e0;
      box-shadow: 2px 0 10px rgba(15, 20, 30, 0.15);
    }
    body.light button:hover { background: #eceef2; }
  </style>
</head>
<body class="dark">
  <button id="expand" title="展开侧边栏 (⌘\)">▶</button>
  <script>
    // 主题跟随壳 UI：主进程加载时通过 query 注入 theme，主题切换时重载
    const theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'light') document.body.classList.add('light');
    document.getElementById('expand').addEventListener('click', async () => {
      await webdeckExpand.expandSidebar();
      window.blur(); // 交还焦点，避免快捷键/焦点留在覆盖视图
    });
  </script>
</body>
</html>
